services:
  db:
    image: mysql:8.4
    # Porta 3307 por padrão para não conflitar com um MySQL/MariaDB local em 3306.
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pedidos_integracao}
      MYSQL_USER: ${MYSQL_USER:-pedidos_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-senha}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-u',
          'root',
          '-p$$MYSQL_ROOT_PASSWORD',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3333
      # Host = nome do serviço na rede do compose.
      DATABASE_URL: mysql://${MYSQL_USER:-pedidos_app}:${MYSQL_PASSWORD:-senha}@db:3306/${MYSQL_DATABASE:-pedidos_integracao}
    ports:
      - '${PORT:-3333}:3333'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3333/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql-data:
